            <span class="motion-node" style="inset-inline-start: 27%; top: 72%"></span>
            <span class="motion-node" style="inset-inline-start: 48%; top: 20%"></span>
            <span class="motion-node" style="inset-inline-start: 73%; top: 64%"></span>
            <span class="motion-node" style="inset-inline-start: 89%; top: 28%"></span>
          </div>

          <div class="section-shell hero-layout">
            <div class="reveal hero-copy">
              <div class="hero-badge">
                <span data-icon="radio"></span>
                <span data-i18n="hero.badge">العمليات الصناعية، البيانات، والبرمجيات</span>

              <p class="hero-subtitle" data-i18n="hero.subtitle"></p>
              <p class="hero-note" data-i18n="hero.note"></p>
              <p class="native-name" data-i18n="brand.nativeName">Bilal Aljaddoua</p>
              <p class="native-role" data-i18n="brand.nativeRole"></p>
              <div class="hero-actions">
                <a class="primary-action" href="#projects">

          <div class="skills-grid" data-skills-grid></div>

          <div data-section-header="projectsSection"></div>

          <div class="faq-list" data-faq-list></div>

        <div class="section-shell">
          <div data-section-header="contact"></div>
          <div class="contact-grid">
            <article class="spc-card contact-form-card reveal">
              <form data-contact-form>
                <div class="form-row">
                  <label>
                    <span data-i18n="contact.form.name">الاسم</span>
                    <input name="name" required data-placeholder="contact.form.namePlaceholder" />
                  </label>
                  <label>
                    <span data-i18n="contact.form.email">البريد الإلكتروني</span>
                    <input type="email" name="email" required data-placeholder="contact.form.emailPlaceholder" />
                  </label>
                </div>
                <label>
                  <span data-i18n="contact.form.subject">الموضوع</span>
                  <input name="subject" data-placeholder="contact.form.subjectPlaceholder" />
                </label>
                <label>
                  <span data-i18n="contact.form.message">الرسالة</span>
                  <textarea name="message" required data-placeholder="contact.form.messagePlaceholder"></textarea>
                </label>
                <button class="primary-action full-submit" type="submit">
                  <span data-i18n="contact.form.send">إرسال الرسالة</span>
                  <span data-icon="send"></span>
                </button>
                <p class="form-status" data-form-status></p>

            <aside class="spc-card links-card reveal">
